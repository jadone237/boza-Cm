<div class="dashboard-shell">

  <!-- BARRE SUPÉRIEURE MOBILE (hamburger, visible uniquement < 992px) -->
  <div class="mobile-topbar">
    <button class="btn-hamburger" (click)="toggleSidebar()" aria-label="Ouvrir le menu">
      <i class="bi bi-list"></i>
    </button>
    <span class="fw-bold" style="color:#0d1f3c;">BozaCM</span>
  </div>

  <!-- OVERLAY : ferme le menu au clic en dehors -->
  <div class="sidebar-overlay" *ngIf="sidebarOuvert" (click)="fermerSidebar()"></div>

  <!-- BARRE LATÉRALE (SIDEBAR) -->
  <aside class="dashboard-sidebar bg-white d-flex flex-column justify-content-between p-3"
    [class.sidebar-ouvert]="sidebarOuvert">
    <div>
      <!-- En-tête de la plateforme -->
      <div class="d-flex justify-content-between align-items-start ps-3 py-4">
        <div>
          <h4 class="fw-bold mb-1" style="color: #0d1f3c; letter-spacing: -0.5px;">BozaCM</h4>
          <span class="text-muted text-uppercase fw-bold" style="font-size: 9px; letter-spacing: 0.8px;">Plateforme d'administration</span>
        </div>
        <button class="btn-close-sidebar" (click)="fermerSidebar()" aria-label="Fermer le menu">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <!-- Liens de Navigation -->
      <ul class="nav nav-pills flex-column gap-1 px-1">
        <li class="nav-item">
          <a [routerLink]="['/dashboard/agences']" routerLinkActive="active-sidebar-link" class="nav-link text-dark d-flex align-items-center gap-3 py-2 px-3 rounded">
            <i class="bi bi-building fs-5"></i>
            <span class="fw-medium">Agences</span>
          </a>
        </li>
        <li class="nav-item">
          <a [routerLink]="['/dashboard/trajets']" routerLinkActive="active-sidebar-link" class="nav-link text-dark d-flex align-items-center gap-3 py-2 px-3 rounded">
            <i class="bi bi-signpost-2 fs-5"></i>
            <span class="fw-medium">Trajets</span>
          </a>
        </li>
        <li class="nav-item">
          <a [routerLink]="['/dashboard/offres']" routerLinkActive="active-sidebar-link" class="nav-link text-dark d-flex align-items-center gap-3 py-2 px-3 rounded">
            <i class="bi bi-tags fs-5"></i>
            <span class="fw-medium">Offres</span>
          </a>
        </li>
        <li class="nav-item">
          <a [routerLink]="['/dashboard/reservations']" routerLinkActive="active-sidebar-link" class="nav-link text-dark d-flex align-items-center gap-3 py-2 px-3 rounded">
            <i class="bi bi-ticket-perforated fs-5"></i>
            <span class="fw-medium">Réservations</span>
          </a>
        </li>
        <li class="nav-item">
          <a [routerLink]="['/dashboard/statistiques']" routerLinkActive="active-sidebar-link" class="nav-link text-dark d-flex align-items-center gap-3 py-2 px-3 rounded">
            <i class="bi bi-bar-chart-line fs-5"></i>
            <span class="fw-medium">Statistiques</span>
          </a>
        </li>
        <li class="nav-item">
          <a [routerLink]="['/dashboard/rapports']" routerLinkActive="active-sidebar-link" class="nav-link text-dark d-flex align-items-center gap-3 py-2 px-3 rounded">
            <i class="bi bi-file-earmark-text fs-5"></i>
            <span class="fw-medium">Rapports</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- Pied de la barre latérale (Paramètres & Déconnexion) -->
    <div class="border-top pt-3 px-1">
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a [routerLink]="['/dashboard/parametres']" routerLinkActive="active-sidebar-link" class="nav-link text-dark d-flex align-items-center gap-3 py-2 px-3 rounded">
            <i class="bi bi-gear fs-5"></i>
            <span class="fw-medium">Paramètres</span>
          </a>
        </li>
        <li class="nav-item">
          <a (click)="logout()" class="nav-link text-danger d-flex align-items-center gap-3 py-2 px-3 rounded" style="cursor: pointer;">
            <i class="bi bi-box-arrow-right fs-5"></i>
            <span class="fw-bold">Déconnexion</span>
          </a>
        </li>
      </ul>
    </div>
  </aside>

  <!-- CONTENU PRINCIPAL DE L'ADMINISTRATION -->
  <main class="dashboard-main">
    <router-outlet></router-outlet>
  </main>
</div>
