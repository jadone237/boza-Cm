<div class="page-wrapper">
  <!-- HEADER CARD -->
  <div class="login-container">
    <div class="login-header">
      <h1>🚌 BozaCM ✈️</h1>
      <p>Découvrez le Cameroun en 1 clic.</p>
    </div>

    <!-- TABS -->
    <div class="login-body">
      <div class="tabs">
        <button
          [class.active]="activeTab === 'admin'"
          (click)="switchTab('admin')">
          Administrateur
        </button>
        <button
          [class.active]="activeTab === 'client'"
          (click)="switchTab('client')">
          Client
        </button>
      </div>

      <!-- FORMULAIRE -->
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <div class="form-group">
          <label>EMAIL</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            [placeholder]="activeTab === 'admin' ? 'admin@bozacm.cm' : 'client@bozacm.cm'"
            #emailField="ngModel"/>
          <span class="error" *ngIf="emailField.invalid && emailField.touched">
            Email invalide
          </span>
        </div>

        <div class="form-group">
          <label>MOT DE PASSE</label>
          <div class="password-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              required
              minlength="6"
              #passwordField="ngModel"/>
            <span class="toggle-pwd" (click)="togglePassword()">
              {{ showPassword ? '🙈' : '👁️' }}
            </span>
          </div>
          <span class="error" *ngIf="passwordField.invalid && passwordField.touched">
            Minimum 6 caractères
          </span>
        </div>

        <span class="error" *ngIf="errorMessage">{{ errorMessage }}</span>

        <button type="button" class="btn-submit" (click)="onSubmit()">Se connecter</button>

      </form>

      <p class="register-link">
        Pas de compte ? <a href="#">S'inscrire</a>
      </p>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="login-footer">
    <span>BozaCM</span>
    <span>© 2024 BozaCM. Découvrez le Cameroun en 1 clic.</span>
    <div>
      <a href="#">Contact</a>
      <a href="#">Conditions d'utilisation</a>
      <a href="#">Confidentialité</a>
    </div>
  </footer>
</div>
